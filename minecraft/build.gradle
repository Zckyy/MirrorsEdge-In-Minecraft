plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Sodium and Iris for checking Faith with shaders (-PwithIris).
	maven { url = "https://api.modrinth.com/maven" }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	mods {
		"faithrunner" {
			sourceSet sourceSets.main
		}
	}
	runs {
		client {
			// The Rust side (faith_ffi.dll) is loaded with Java's foreign-function API.
			vmArgs "--enable-native-access=ALL-UNNAMED", "-Dfaithrunner.audit=true"
		}
	}
}

// faith_ffi as cargo builds it (cargo build --release -p faith_ffi, in the repo root).
def faithDll = new File(rootDir, "../target/release/faith_ffi.dll").canonicalPath.replace("\\", "/")

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Iris's shadow pass, to draw her shadow there (IrisShadowMixin; skipped when Iris is absent).
	compileOnly "maven.modrinth:iris:1.11.7+26.3-fabric"
	compileOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
	if (project.hasProperty("withIris")) {
		runtimeOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
		runtimeOnly "maven.modrinth:iris:1.11.7+26.3-fabric"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}


// Client game tests: a test world with Faith on, screenshots of her body (./gradlew runClientGameTest).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "faithrunner-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.configureEach {
	vmArgs "--enable-native-access=ALL-UNNAMED", "-Dfaithrunner.heldOnly=" + (project.hasProperty("heldOnly") ? "true" : "false"), "-Dfaithrunner.dll=" + faithDll
}

// -PwithShader: the test world runs a shader pack through Iris (with -PwithIris). The pack's
// zip: -PshaderZip=<path>, or Complementary Reimagined in the deploy profile's shaderpacks.
if (project.hasProperty("withShader")) {
	tasks.named("runClientGameTest") {
		doFirst {
			def zip = file(project.findProperty("shaderZip") ?: "${System.getenv('APPDATA')}/.minecraft/faithrunner-26.3/shaderpacks/ComplementaryReimagined_r5.9.3.zip")
			if (!zip.exists()) {
				throw new GradleException("-PwithShader: no shader pack at ${zip} (pass -PshaderZip=<path>)")
			}
			def dir = file("build/run/clientGameTest")
			copy { from zip; into new File(dir, "shaderpacks") }
			new File(dir, "config").mkdirs()
			new File(dir, "config/iris.properties").text = "enableShaders=true\nshaderPack=${zip.name}\n"
		}
	}
}

// ./gradlew deploy: builds the mod and puts it (and faith_ffi.dll) in the Faith Runner launcher profile.
tasks.register("deploy", Copy) {
	dependsOn "build"
	from(tasks.named("jar"))
	into "${System.getenv('APPDATA')}/.minecraft/faithrunner-26.3/mods"
	doLast {
		copy {
			from System.getProperty("faithrunner.dll", faithDll)
			into "${System.getenv('APPDATA')}/.minecraft/faithrunner-26.3"
		}
	}
}
